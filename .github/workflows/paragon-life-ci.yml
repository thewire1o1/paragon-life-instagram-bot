name: Paragon Life CI
on:
  push:
    branches: [site-paragon-life-v2]
  pull_request:
    branches: [site-paragon-life-v2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check api/_commerce.mjs
          node --check api/catalog.js
          node --check api/cart.js
          node --check api/checkout.js
      - name: Run security tests
        run: npm test
      - name: Verify static pages
        run: |
          test -s index.html
          test -s sitemap.xml
          test -s robots.txt
          test -s assets/hero-desert.jpg
          test -s assets/favicon.webp
